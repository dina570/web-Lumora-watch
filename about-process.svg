<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Suasana meja kerja perakitan jam tangan LUMORA" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="360" fill="#EFEAE0"/>
  <rect x="0" y="250" width="480" height="110" fill="#8A6A45"/>
  <rect x="0" y="250" width="480" height="10" fill="#6E5233"/>

  <!-- jam tangan tergeletak di meja -->
  <g transform="translate(150,230) rotate(-8)">
    <rect x="-90" y="-8" width="80" height="16" rx="6" fill="#4A3B2A"/>
    <rect x="70" y="-8" width="80" height="16" rx="6" fill="#4A3B2A"/>
    <circle cx="0" cy="0" r="52" fill="#1A1815" stroke="#A8823E" stroke-width="4"/>
    <circle cx="0" cy="0" r="40" fill="#F6F3EC"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#1A1815" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="6" stroke="#1A1815" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- obeng kecil -->
  <g transform="translate(300,215) rotate(20)">
    <rect x="-4" y="-46" width="8" height="46" fill="#6E6A63"/>
    <rect x="-7" y="0" width="14" height="26" rx="3" fill="#1A1815"/>
  </g>

  <!-- kaca pembesar / loupe -->
  <g transform="translate(360,240)">
    <circle cx="0" cy="0" r="26" fill="#F6F3EC" fill-opacity="0.5" stroke="#A8823E" stroke-width="4"/>
    <line x1="18" y1="18" x2="40" y2="40" stroke="#A8823E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- kotak perkakas kecil -->
  <rect x="60" y="200" width="46" height="30" rx="4" fill="#3A362D"/>
  <rect x="60" y="196" width="46" height="8" rx="2" fill="#242019"/>

  <text x="240" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F6F3EC">Proses di Balik LUMORA</text>
</svg>
